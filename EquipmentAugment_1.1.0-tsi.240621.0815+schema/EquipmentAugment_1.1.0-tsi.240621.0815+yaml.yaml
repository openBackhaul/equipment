          type: object
        spatial-properties-of-type:
          type: object
          properties:
            height:
              type: string
            width:
              type: string
            length:
              type: string
        environmental-rating:
          type: object
          properties:
            thermal-rating:
              type: object
              properties:
                thermal-rating-name:
                  type: string
                maximum-temperature:
                  type: string
                minimum-temperature:
                  type: string
            power-rating:
              type: object
              properties:
                power-rating-name:
                  type: string
                power-rating-value:
                  type: string
            humidity-rating:
              type: string
        manufactured-thing:
          type: object
          required:
            - manufacturer-properties
            - equipment-type
            - equipment-instance
          properties:
            manufacturer-properties:
              type: object
              required:
                - manufacturer-name
              properties:
                manufacturer-identifier:
