                model-identifier:
                  type: string
                part-type-identifier:
                  type: string
                type-name:
                  type: string
                version:
                  type: string
                equipment-augment-1-0:equipment-type-pac:
                  type: object
                  required:
                    - outside-label
                    - lct-label
                  properties:
                    outside-label:
                      type: string
                    lct-label:
                      type: string
            equipment-instance:
              type: object
              required:
                - manufacture-date
                - serial-number
              properties:
                manufacture-date:
                  type: string
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                serial-number:
                  type: string
                asset-instance-identifier:
                  type: string
            operator-augmented-equipment-type:
              type: object
              properties:
                asset-type-identifier:
                  type: string
            operator-augmented-equipment-instance:
              type: object
              properties:
                asset-instance-identifier:
                  type: string
