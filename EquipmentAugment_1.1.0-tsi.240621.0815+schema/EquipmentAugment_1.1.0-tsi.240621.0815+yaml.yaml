        swappability:
          type: object
          properties:
            is-hot-swappable:
              type: boolean
        physical-properties:
          type: object
          required:
            - temperature
          properties:
            temperature:
              type: string
        function-enablers:
          type: object
          properties:
            power-state:
              type: string
        mechanical-functions:
          type: object
          properties:
            rotation-speed:
              type: string
        physical-characteristics:
          type: object
          properties:
            weight-characeristics:
              type: string
            fire-characteristics:
              type: string
            materials:
              type: string
