          type: string
        name:
          type: array
        label:
          type: array
        extension:
          type: array
        operational-state:
          type: string
          enum:
            - 'core-model-1-4:OPERATIONAL_STATE_DISABLED'
            - 'core-model-1-4:OPERATIONAL_STATE_ENABLED'
        administrative-control:
          type: string
        administrative-state:
          type: string
        lifecycle-state:
          type: string
        address:
          type: array

