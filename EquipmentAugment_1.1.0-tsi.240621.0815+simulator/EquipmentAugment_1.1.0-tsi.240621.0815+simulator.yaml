          x-key: uuid
          items:
            $ref: '#/components/schemas/forwarding-domain'
        profile-collection:
          $ref: '#/components/schemas/profile-collection'
        external-managed-id:
          type: object
          properties:
            manager-identifier:
              type: string
            external-managed-uuid:
              type: string
        local-id:
