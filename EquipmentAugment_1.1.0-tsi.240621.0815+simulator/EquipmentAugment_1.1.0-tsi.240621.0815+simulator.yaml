        uuid:
          type: string
        name:
          type: array
        label:
          type: array
        extension:
          type: array
        operational-state:
          type: string
        administrative-control:
          type: string
        administrative-state:
          type: string
        lifecycle-state:
          type: string
        address:
          type: array
        equipment-augment-1-0:control-construct-pac:
          type: object
          required:
            - external-label
            - last-config-change-timestamp
